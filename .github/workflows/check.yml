name: Check catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline helpers
        run: python -m unittest discover -s tests -v
      - name: Validate catalog
        run: python scripts/reinvent.py validate
      - name: Check schedule
        run: python scripts/reinvent.py check-schedule
      - name: Check generated documents
        run: |
          python scripts/reinvent.py render
          git diff --exit-code -- docs/catalog.md docs/events.md sessions/
          test -z "$(git ls-files --others --exclude-standard -- docs/catalog.md docs/events.md sessions/)"
